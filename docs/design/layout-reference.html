<div id="life-draft" aria-label="个人生活 App 页面草图">
<style>
#life-draft{--paper:light-dark(#fafaf8,#202321);--side:light-dark(#efefeb,#282c29);--ink:light-dark(#292e29,#e4e8e2);--sub:light-dark(#6c736b,#a7afa5);--line:light-dark(#dedfd8,#40463f);--panel:light-dark(#fff,#292e29);--brand:light-dark(#3e604c,#b8d1bc);--onbrand:light-dark(#fff,#202c23);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
#life-draft *{box-sizing:border-box}#life-draft button,#life-draft input,#life-draft textarea,#life-draft select{font:inherit;color:inherit}#life-draft button{border:1px solid var(--line);border-radius:7px;background:var(--panel);padding:7px 12px}#life-draft button:hover{background:var(--side)}#life-draft .primary{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}#life-draft .chrome{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;background:var(--side);border-bottom:1px solid var(--line);font-size:12px;color:var(--sub)}#life-draft .dots{display:flex;gap:7px}#life-draft .dots span{width:10px;height:10px;border-radius:50%;background:var(--sub);opacity:.45}#life-draft .shell{display:grid;grid-template-columns:170px minmax(0,1fr);min-height:640px}#life-draft nav{background:var(--side);padding:22px 12px;display:flex;flex-direction:column;gap:5px}#life-draft .brand{font-size:18px;font-weight:600;padding:0 12px 25px}#life-draft nav button{border:0;background:transparent;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px}#life-draft nav button[aria-current=page]{background:var(--panel);color:var(--brand);font-weight:600}#life-draft nav button:last-child{margin-top:auto}#life-draft main{padding:30px;min-width:0}#life-draft h1{font-size:25px;margin:0;font-weight:600}#life-draft h2{font-size:16px;margin:0 0 15px;font-weight:600}#life-draft h3{font-size:14px;margin:0 0 8px;font-weight:600}#life-draft p{margin:7px 0}#life-draft .sub{color:var(--sub);font-size:12px}#life-draft .heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px;flex-wrap:wrap}#life-draft .columns{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}#life-draft .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px}#life-draft .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}#life-draft .row:last-child{border:0}#life-draft .task{display:flex;align-items:center;gap:10px}#life-draft input[type=checkbox]{accent-color:var(--brand);width:17px;height:17px}#life-draft input:not([type=checkbox]),#life-draft textarea,#life-draft select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:9px;max-width:100%;width:100%}#life-draft textarea{min-height:110px;resize:vertical}#life-draft label{display:block}#life-draft .tag{background:var(--side);border-radius:5px;padding:3px 7px;font-size:12px;color:var(--sub)}#life-draft .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}#life-draft .toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}#life-draft .toolbar input{flex:1;min-width:120px}#life-draft .spacer{margin-top:18px}#life-draft .detail{border-left:3px solid var(--brand)}#life-draft .notice{color:var(--sub);font-size:12px;min-height:20px;margin-top:14px}#life-draft .stat{font-size:27px;font-weight:500}#life-draft .notearea{min-height:235px}#life-draft .history{margin-top:20px}#life-draft .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}#life-draft .fields label{font-size:12px;color:var(--sub)}#life-draft .fields input{margin-top:5px}#life-draft .empty{padding:26px;text-align:center;color:var(--sub)}
@media(max-width:720px){#life-draft .shell{grid-template-columns:1fr}#life-draft nav{flex-direction:row;flex-wrap:wrap;padding:10px}#life-draft .brand{width:100%;padding:0 10px 7px}#life-draft nav button:last-child{margin-top:0}#life-draft main{padding:20px}#life-draft .columns{grid-template-columns:1fr}}@media(max-width:420px){#life-draft .grid,#life-draft .fields{grid-template-columns:1fr}#life-draft main{padding:14px}}
</style>
<div class="chrome"><div class="dots" aria-hidden="true"><span></span><span></span><span></span></div><span>个人空间 · 页面草图</span><span>示例内容</span></div>
<div class="shell"><nav aria-label="主导航"><div class="brand">我的日常<span class="sub"> / PERSONAL</span></div></nav><main></main></div>
</div>
<script>
(()=>{
const root=document.getElementById('life-draft'),nav=root.querySelector('nav'),main=root.querySelector('main');
const pages=['首页总览','今日计划','开发工作','健身计划','饮食计划','游戏娱乐','笔记','设置与数据'];
const icons=['house','list-checks','code-2','dumbbell','utensils','gamepad-2','notebook-pen','settings'];
let page=0,done=false,trained=false,meal=false,detail=false,tab='任务与问题';
let tasks=['阅读 20 分钟','整理本周学习笔记'];let memo='周末整理一下书桌';let games=[['星露谷物语',45]];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function restore(s){const p=s?.privateContent?.page;if(Number.isInteger(p)&&p>=0&&p<8)page=p;}restore(window.openai?.widgetState);
function save(){window.openai?.setWidgetState({modelContent:{design:'个人学习生活 App 页面草图',page:pages[page]},privateContent:{page}})?.catch(()=>{});}
function btn(t,a,primary=false){return `<button class="${primary?'primary ':''}cursor-interaction" data-action="${a}">${t}</button>`;}
function panel(t,c){return `<section class="panel"><h2>${t}</h2>${c}</section>`;}
function tasklist(){return tasks.map((t,i)=>`<div class="row"><label class="task"><input type="checkbox" data-task="${i}" ${i===0&&done?'checked':''}><span style="${i===0&&done?'text-decoration:line-through':''}">${esc(t)}</span></label>${i===0?btn('详情','detail'):''}</div>`).join('')+`<div class="row"><div><span class="tag">健身</span> 下肢训练<p class="sub">18:30 提醒 · ${trained?'已完成':'待训练'}</p></div>${btn(trained?'查看记录':'记录训练','go3')}</div>`;}
function render(){nav.querySelectorAll('button').forEach(n=>n.remove());pages.forEach((p,i)=>{const b=document.createElement('button');b.className='cursor-interaction';b.innerHTML=`<i data-lucide="${icons[i]}" aria-hidden="true"></i>${p}`;if(i===page)b.setAttribute('aria-current','page');b.onclick=()=>{page=i;detail=false;render();save()};nav.appendChild(b)});
let body='';
if(page===0)body=`<div class="columns"><div>${panel('今天，慢慢把事情做好',tasklist()+`<div class="spacer">${btn('＋ 添加待办','go1')}</div>`)}</div><div>${panel('快速备忘',`<textarea aria-label="快速备忘" id="memo">${esc(memo)}</textarea><div class="spacer">${btn('保存备忘','memo',true)}</div>`)}</div></div><div class="grid">${panel('开发工作',`<h3>个人学习生活 App</h3><p class="sub">最近进展：页面结构已确认</p>${btn('查看项目','go2')}`)}${panel('饮食与娱乐',`<p>饮食：${meal?'午餐已记录':'午餐待记录'}</p><p>游戏：今日 ${games.reduce((s,g)=>s+g[1],0)} 分钟</p><div class="toolbar">${btn('记饮食','go4')}${btn('记游戏','go5')}</div>`)}</div>`;
if(page===1)body=`<div class="toolbar"><input id="newtask" aria-label="新待办" placeholder="今天想做什么？">${btn('添加','addtask',true)}</div><div class="spacer">${panel('今天的安排',tasklist())}</div>${detail?`<section class="panel detail"><h2>阅读 20 分钟</h2><label>说明<textarea>读完当前章节，记下一个有用的想法。</textarea></label><label class="spacer">提醒时间<input type="time" value="20:30"></label><div class="spacer">${btn('保存修改','savedetail',true)}</div></section>`:''}<details class="history"><summary>此前未完成 · 1 项</summary><div class="row">整理下载文件夹${btn('移到今天','move')}</div></details>`;
if(page===2)body=`<div class="columns"><section class="panel"><span class="tag">进行中</span><h2 class="spacer">个人学习生活 App</h2><p class="sub">下一步：确认页面布局</p><div class="toolbar spacer">${['任务与问题','开发笔记','进展记录'].map(t=>btn(t,'tab'+t,tab===t)).join('')}</div><div class="spacer">${tab==='任务与问题'?'<div class="row">确认页面布局 <span class="tag">进行中</span></div><div class="row">整理数据字段 <span class="tag">待处理</span></div><div class="row">问题：退出后的提醒机制 <span class="tag">待确认</span></div>':tab==='开发笔记'?'<h3>数据保存思路</h3><p>数据文件与应用分开存放，恢复前保存当前版本。</p>':'<h3>9 月 29 日</h3><p>已确认第一版范围与页面结构。</p><p class="sub">下一步：检查各模块的日常使用流程。</p>'}</div></section>${panel('项目概况','<p>状态：进行中</p><p>任务：1 项进行中 · 1 项待处理</p><p>问题：1 项待确认</p><p class="sub">项目内保留任务、笔记和进展历史。</p>')}</div>`;
if(page===3)body=`${panel('本周训练安排','<div class="row">周二 · 下肢训练 <span class="tag">今天</span></div><div class="row">周四 · 上肢训练 <span class="tag">18:30</span></div>')}<section class="panel"><div class="heading"><h2>今日 · 下肢训练</h2><span class="tag">${trained?'已完成':'尚未完成'}</span></div><h3>深蹲</h3><p class="sub">计划：3 组 × 10 次 · 40 kg</p><div class="fields"><label>实际次数／组<input type="number" value="10" min="0"></label><label>实际重量（kg）<input type="number" value="40" min="0"></label></div><div class="row">第 1 组<label class="task"><input type="checkbox">完成</label></div><div class="row">第 2 组<label class="task"><input type="checkbox">完成</label></div><div class="row">第 3 组<label class="task"><input type="checkbox">完成</label></div><div class="toolbar spacer">${btn(trained?'已完成训练':'完成训练','train',true)}${btn('提醒 · 18:30','remind')}</div></section><details><summary>训练历史</summary><p>9 月 26 日 · 上肢训练 · 已完成</p></details>`;
if(page===4)body=`<div class="panel"><p class="sub">已填写部分合计</p><span class="stat">${meal?'1,030':'380'}</span> kcal · 蛋白质 ${meal?'58':'18'} g</div><div class="grid">${panel('早餐','<p class="sub">计划</p><p>燕麦、牛奶、鸡蛋</p><div class="row">实际：按计划吃了<span class="tag">已记录</span></div><p class="sub">380 kcal · 蛋白质 18 g</p>')}${panel('午餐',`<p class="sub">计划</p><p>米饭、鸡胸肉、炒西兰花</p><p class="sub">实际：${meal?'按计划吃了':'未记录'}</p>${btn(meal?'已记录':'按计划吃了','meal',true)}<div class="fields spacer"><label>热量（kcal）<input type="number" value="650" min="0"></label><label>蛋白质（g）<input type="number" value="40" min="0"></label></div>`)}${panel('晚餐','<label>计划吃什么<textarea placeholder="例如：番茄鸡蛋面"></textarea></label><p class="sub">实际：未记录</p>')}${panel('加餐','<label>实际吃了什么<textarea placeholder="可选记录水果、零食等"></textarea></label>')}</div>`;
if(page===5)body=`<div class="columns"><section class="panel"><p class="sub">今日游戏总时长</p><div class="stat">${games.reduce((s,g)=>s+g[1],0)} 分钟</div>${games.map(g=>`<div class="row"><span>${esc(g[0])}</span><span>${g[1]} 分钟</span></div>`).join('')}</section><section class="panel"><h2>记录游戏</h2><label>游戏名称<input id="game" placeholder="例如：星露谷物语"></label><div class="fields spacer"><label>小时<input id="hours" type="number" value="0" min="0"></label><label>分钟<input id="minutes" type="number" value="30" min="0" max="59"></label></div><div class="spacer">${btn('保存记录','game',true)}</div></section></div>`;
if(page===6)body=`<div class="columns">${panel('我的笔记','<label>搜索笔记<input aria-label="搜索笔记" placeholder="输入关键词" id="search"></label><div class="row" id="noteitem">学习方法：主动回忆</div><p class="sub">学习生活 · 今天修改</p>')}<section class="panel"><h2>学习方法：主动回忆</h2><textarea class="notearea" aria-label="笔记正文">读完一节后，先合上书，用自己的话说出三个要点。\n\n不必一次记住所有内容，先找到不理解的部分。</textarea><p class="sub">设计示例 · 正式版自动保存</p></section></div>`;
if(page===7)body=`${panel('数据文件','<div class="row"><div><h3>独立保存在本机</h3><p class="sub">保存位置将在首次使用时确定</p></div><span class="tag">本地文件</span></div>')}${panel('备份与恢复',`<div class="row"><span>自动备份</span><label class="task"><input type="checkbox" checked>启用</label></div><p class="sub">最近备份：示例 · 今天 09:00</p><div class="toolbar spacer">${btn('手动备份','backup',true)}${btn('从备份恢复','restore')}</div><div id="restorebox"></div>`)}${panel('通知','<div class="row"><span>待办与训练提醒</span><span class="tag">需要系统授权</span></div><p class="sub">实际系统通知与后台运行将在开发阶段实现验证。</p>')}`;
main.innerHTML=`<header class="heading"><div><h1>${pages[page]}</h1><p class="sub">${page===0?'9 月 29 日 · 星期二':page===7?'本地数据，由你掌握':page===2?'项目、问题与进展':page===6?'把值得留下的想法记下来':'9 月 29 日 · 今天'}</p></div><span class="tag">设计预览</span></header>${body}<div class="notice" aria-live="polite" id="notice"></div>`;
globalThis.lucide?.createIcons({attrs:{width:16,height:16}});
}
function say(t){main.querySelector('#notice').textContent=t;}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;
if(a.startsWith('go')){page=Number(a.slice(2));render();save();return;}
if(a.startsWith('tab')){tab=a.slice(3);render();return;}
if(a==='detail'){detail=!detail;render();}if(a==='savedetail'){detail=false;render();say('预览：提醒已设为所选时间，不发送系统通知。');}
if(a==='addtask'){const value=main.querySelector('#newtask').value.trim();if(value){tasks.push(value);render();}else say('请先填写待办名称。');}
if(a==='move'){tasks.push('整理下载文件夹');render();main.querySelector('.history').hidden=true;say('已移到今天。');}
if(a==='memo'){memo=main.querySelector('#memo').value;say('备忘已保留在本次预览中。');}
if(a==='train'){trained=true;render();say('首页和今日计划中的训练状态已同步更新。');}
if(a==='meal'){meal=true;render();say('已将午餐计划复制为实际记录。');}
if(a==='remind')say('预览：这次训练将在 18:30 提醒；正式版可修改或关闭。');
if(a==='game'){const name=main.querySelector('#game').value.trim(),h=Number(main.querySelector('#hours').value),m=Number(main.querySelector('#minutes').value);if(!name||!Number.isInteger(h)||!Number.isInteger(m)||h<0||m<0||m>59||h*60+m<=0){say('请填写游戏名称和有效时长，分钟为 0–59。');return;}games.push([name,h*60+m]);render();say('游戏记录已加入本次预览。');}
if(a==='backup')say('流程预览：选择备份位置 → 导出备份 → 显示完成时间。本草图不会创建备份文件。');
if(a==='restore')main.querySelector('#restorebox').innerHTML='<div class="detail panel spacer"><h3>恢复前确认</h3><p>先备份当前数据，再用所选备份替换当前记录。</p><p class="sub">正式版在此显示所选备份时间和文件位置。</p>'+btn('取消','cancelrestore')+'</div>';
if(a==='cancelrestore')main.querySelector('#restorebox').innerHTML='';
});
root.addEventListener('change',e=>{if(e.target.dataset.task==='0'){done=e.target.checked;render();}});
root.addEventListener('keydown',e=>{if(e.target.id==='newtask'&&e.key==='Enter')main.querySelector('[data-action=addtask]').click();});
root.addEventListener('input',e=>{if(e.target.id==='search'){main.querySelector('#noteitem').hidden=!'学习方法：主动回忆'.includes(e.target.value);}});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
render();
const design={compact:false};if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{main.style.padding=design.compact?'20px':'30px';}});tweak.addToggle(design,'compact',{label:'紧凑内容间距'});}
})();
</script>
